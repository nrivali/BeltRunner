<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belt Runner · Asteroid assets</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e14;color:#d7e2eb;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}#stage{position:absolute;inset:0}header{position:absolute;left:30px;top:25px;pointer-events:none}h1{font-size:23px;letter-spacing:.14em;font-weight:500;margin:0 0 8px}header p{margin:0;color:#8d9dac;font-size:12px;letter-spacing:.12em}aside{position:absolute;right:24px;top:24px;width:225px;background:#0c1520e8;border:1px solid #273543;border-radius:12px;padding:20px;backdrop-filter:blur(12px)}label{display:block;color:#96aabc;font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 7px}select,button{width:100%;padding:10px;background:#172330;color:#edf4fa;border:1px solid #324556;border-radius:5px;margin:0 0 18px;font:inherit}button{cursor:pointer;margin-bottom:0}button:hover{background:#23394d}footer{position:absolute;left:30px;bottom:26px;color:#93a7b8;font-size:12px;line-height:1.8}#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;background:#0e1b28dd;border-radius:10px}#status:empty{display:none}#count{color:#dae5ee}a{color:#9ecfe3;text-decoration:none}@media(max-width:700px){aside{width:165px;right:12px;padding:12px}header{left:16px;top:18px;max-width:50%}h1{font-size:17px}footer{left:16px;max-width:50%}}
</style></head><body>
<div id="stage"></div><header><h1>BELT RUNNER 3D</h1><p>TEXTURED ASTEROID LIBRARY</p></header>
<aside><label for="shape">Rock shape</label><select id="shape"></select><label for="variant">Variation</label><select id="variant"><option>A</option><option>B</option></select><label for="ore">Ore material</label><select id="ore"></select><label for="lod">Detail level</label><select id="lod"><option value="0">Near · LOD 0</option><option value="1">Medium · LOD 1</option><option value="2">Distant · LOD 2</option></select><button id="spin">Pause rotation</button></aside>
<div id="status">Loading textured assets…</div><footer><div id="count"></div>Drag to orbit · Scroll to inspect at a distance<br>Sunlight + reflected fill · <a href="README.md">Asset notes</a></footer>
<script src="../../vendor/three-r158/three.min.js"></script><script src="../../vendor/three-r158/GLTFLoader.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.setClearColor(0x080e14);$('stage').appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.01,1000);let radius=6,yaw=.35,pitch=.23,spin=true,object=null,selection=0;
const sun=new THREE.DirectionalLight(0xffecd2,3.4);sun.position.set(-5,5,7);scene.add(sun,new THREE.HemisphereLight(0xb9d7ef,0x11151b,.25));
// A prefiltered sky and broad reflected light illuminate the metallic materials.
const env=new THREE.Scene();env.background=new THREE.Color(.07,.095,.13);
for(const [pos,color,intensity,size] of [[[-5,5,5],0xfff2dc,5,5],[[5,1,3],0xb8d8ff,2,5],[[1,-5,-2],0x7c94b2,.4,4]]){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));m.material.color.multiplyScalar(intensity);m.position.set(...pos);m.lookAt(0,0,0);env.add(m);
}
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(env,.06).texture;pmrem.dispose();
const loader=new BeltRunnerGLTFLoader(),cache=new Map();let manifest,report;
async function library(lod){if(!cache.has(lod))cache.set(lod,loader.loadAsync(`asteroids_lod${lod}.glb`));return cache.get(lod);}
async function show(){
 const turn=++selection,lod=+$('lod').value;$('status').textContent='Loading textured assets…';
 try{
  const gltf=await library(lod),name=`${$('shape').value}_${$('variant').value}_LOD${lod}`,source=gltf.scene.getObjectByName(name);
  if(!source)throw new Error('Missing model '+name);
  const clone=source.clone(true);clone.position.set(0,0,0);clone.rotation.set(.18,0,.05);
  const key=$('ore').value,materialName=key==='barren'?'Barren_Regolith':'Ore_'+key;
  const idx=gltf.parser.json.materials.findIndex(m=>m.name===materialName),oreMaterial=await gltf.parser.getDependency('material',idx);
  clone.traverse(m=>{if(m.isMesh&&m.material.name.startsWith('Ore_'))m.material=oreMaterial;});
  if(turn!==selection)return;
  if(object)scene.remove(object);object=clone;scene.add(object);
  const box=new THREE.Box3().setFromObject(object),bound=box.getBoundingSphere(new THREE.Sphere());radius=bound.radius*3.6;
  const data=report.assets.find(a=>a.name===name);$('count').textContent=`${data.shape.toUpperCase()} ${data.variant} · ${data.triangles.toLocaleString()} triangles · ${key.toUpperCase()}`;
  $('status').textContent='';window.assetPreview.current={name,key,lod,object,triangles:data.triangles};render();
 }catch(e){$('status').textContent=e.message;window.assetPreview.error=e.message;throw e;}
}
function render(){camera.position.set(radius*Math.cos(pitch)*Math.sin(yaw),radius*Math.sin(pitch),radius*Math.cos(pitch)*Math.cos(yaw));camera.lookAt(0,0,0);renderer.render(scene,camera);}
let previous=performance.now();function animate(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(object&&spin)object.rotation.y+=dt*.15;render();requestAnimationFrame(animate);}requestAnimationFrame(animate);
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-drag.x)*.007;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-drag.y)*.007));drag={x:e.clientX,y:e.clientY};}});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(1.3,Math.min(45,radius*Math.exp(e.deltaY*.001)));},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
$('spin').onclick=()=>{spin=!spin;$('spin').textContent=spin?'Pause rotation':'Rotate rock';};
window.assetPreview={library,show,renderer,scene,camera,render,cache,error:null};
(async()=>{
 [manifest,report]=await Promise.all([fetch('manifest.json').then(r=>r.json()),fetch('asset-report.json').then(r=>r.json())]);
 for(const shape of manifest.shapeFamilies)$('shape').add(new Option(shape[0].toUpperCase()+shape.slice(1),shape));
 for(const key of manifest.materialVariants)$('ore').add(new Option(key==='barren'?'Barren rock':report.ore_types[key].label,key));
 for(const id of ['shape','variant','ore','lod'])$(id).onchange=show;
 await show();window.assetPreview.ready=true;
})().catch(e=>{$('status').textContent=location.protocol==='file:'?'Serve the project over local HTTP to load the GLB files. See README.':e.message;window.assetPreview.error=e.message;});
</script></body></html>
