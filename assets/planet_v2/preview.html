<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferron — Planet Model</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#010204;color:#e2e6e9;font:14px system-ui,sans-serif}canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;top:7%;left:6%;pointer-events:none}small{letter-spacing:.32em;color:#9ba9b7;font-size:10px}h1{font-size:clamp(48px,6vw,90px);letter-spacing:-.045em;font-weight:450;margin:14px 0 12px}header p{color:#8d98a1;line-height:1.7;max-width:260px}footer{position:absolute;bottom:5%;left:6%;right:6%;display:flex;justify-content:space-between;align-items:end;color:#8997a6;font-size:12px}button{padding:10px 18px;background:#111c28;color:#dce6f0;border:1px solid #334251;border-radius:30px;cursor:pointer}button:hover{background:#233245}#status{color:#c7b399}a{color:#c4d4df;text-decoration:none;margin-left:18px}
</style></head><body>
<header><small>BELT RUNNER 3D / KESSLER BELT</small><h1>Ferron.</h1><p>Ancient impact basins.<br>Fractured highlands.<br>A world shaped by the belt.</p><p id="status">Loading planet…</p></header>
<footer><span>Drag to orbit · Scroll to approach</span><div><button id="phase">View terminator</button><a href="belt-runner-3d.html">Open game ↗</a></div></footer>
<script src="vendor/three-r158/three.min.js"></script><script src="vendor/three-r158/GLTFLoader.js"></script><script src="assets/planet_v2/load-planet.js"></script>
<script>
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100),sunDir=new THREE.Vector3(.65,.3,1).normalize();
const sun=new THREE.DirectionalLight(0xfff3e3,5.3);sun.position.copy(sunDir).multiplyScalar(10);scene.add(sun,new THREE.HemisphereLight(0xc9ced5,0x494139,.16),new THREE.AmbientLight(0xc5c9d0,.025));
const p={name:'Ferron',r:1,group:new THREE.Group()};scene.add(p.group);
let azimuth=.2,elevation=.18,distance=3.65,drag=false,x=0,y=0,night=false;
BeltRunnerPlanets.attach(p,{renderer,sunDir}).then(ok=>document.getElementById('status').textContent=ok?'BLENDER MODEL / PBR SURFACE':'Model unavailable — reload to retry');
const canvas=renderer.domElement;canvas.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-x)*.006;elevation=Math.max(-1.25,Math.min(1.25,elevation+(e.clientY-y)*.005));x=e.clientX;y=e.clientY;};canvas.onwheel=e=>{e.preventDefault();distance=Math.max(1.3,Math.min(6,distance+e.deltaY*.003));};
document.getElementById('phase').onclick=()=>{night=!night;azimuth=night?2:.2;document.getElementById('phase').textContent=night?'View sunlit surface':'View terminator';};
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
function frame(){requestAnimationFrame(frame);camera.position.set(Math.sin(azimuth)*Math.cos(elevation),Math.sin(elevation),Math.cos(azimuth)*Math.cos(elevation)).multiplyScalar(distance);camera.lookAt(0,0,0);renderer.render(scene,camera);}frame();
</script></body></html>
