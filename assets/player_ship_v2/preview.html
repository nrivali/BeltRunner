<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belt Runner / Player Mining Ship</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#03070c;color:#ece8dc;font:14px system-ui,sans-serif}canvas{display:block;touch-action:none;cursor:grab}header{position:absolute;top:5%;left:4%;pointer-events:none;text-shadow:0 2px 12px #000;background:linear-gradient(110deg,#08101dcc,transparent);padding:16px 22px;border-left:1px solid #b69864}small{font-size:10px;letter-spacing:.26em;color:#c8ad7c}h1{font-weight:450;font-size:clamp(30px,4vw,54px);letter-spacing:-.04em;margin:12px 0}p{color:#b4c1c7;font-size:12px;line-height:1.8}footer{position:absolute;left:4%;right:4%;bottom:4%;display:flex;justify-content:space-between;gap:15px;align-items:end;color:#aebcc4;font-size:12px}button,select,a{display:inline-block;border:1px solid #53616d;background:#111d29e8;color:#ede9dc;border-radius:22px;padding:10px 13px;margin:3px;text-decoration:none;cursor:pointer}button:hover,select:hover{background:#314355}label{display:inline-flex;align-items:center;gap:6px}input[type=color]{background:transparent;border:0;width:34px;height:32px;cursor:pointer}.controls{max-width:760px;text-align:right}@media(max-width:800px){header{top:3%;left:3%}h1{font-size:32px}footer{flex-direction:column;align-items:start}.controls{text-align:left}button,select,a{padding:8px 10px}}</style>
</head><body><header><small>BELT RUNNER 3D / PLAYER SHIP</small><h1>Your place in the belt.</h1><p>Curved armor. A clear view. Tools within reach.</p><p id="status">Preparing the mining skiff…</p></header><footer><span>Drag to orbit · Scroll to approach</span><div class="controls"><div><button id="front">Front</button><button id="rear">Engines</button><button id="cockpit">Cockpit</button><button id="tool">Mining tool</button><button id="motion">Pause dish</button></div><div><select id="wings" aria-label="Wing plan"><option value="delta">Delta wings</option><option value="swept">Swept wings</option><option value="forward">Forward wings</option><option value="twin">Twin booms</option></select><select id="tier" aria-label="Upgrade tier"><option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option></select><label>Hull <input id="paint" aria-label="Hull color" type="color" value="#ece8dd"></label><a href="belt-runner-3d.html">Open game ↗</a></div></div></footer>
<script src="vendor/three-r158/three.min.js"></script><script src="vendor/three-r158/GLTFLoader.js"></script><script src="assets/lighting/space-lighting.js"></script><script src="assets/hub_planet/load-homeworld.js"></script><script src="assets/player_ship_v2/assemble-player-ship.global.js"></script><script src="assets/player_ship_v2/load-player-ship.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020509);scene.fog=new THREE.FogExp2(0x020509,0);
const renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,1,2e7),station=new THREE.Group();scene.add(station);
const sunDir=new THREE.Vector3(.45,.65,.6).normalize(),lighting=createBeltRunnerLighting({renderer,scene,sunDir,skyRadius:5e6});lighting.setZone({id:'hub',sunDir:sunDir.toArray(),fog:0});
const p={name:'Meridian',r:38000,pos:new THREE.Vector3(-27000,-50000,-65000),group:new THREE.Group()};p.group.position.copy(p.pos);scene.add(p.group);BeltRunnerHomeworld.attach(p,{renderer,sunDir});
let api,motion=true,time=0,azimuth=.68,elevation=.34,distance=4200,target=new THREE.Vector3(0,0,0),drag=false,x=0,y=0,last=performance.now();const status={state:'loading'};
loadBeltRunnerPlayerShip({renderer,status,install:loaded=>{api=loaded;api.ship.scale.setScalar(100);station.add(api.ship);for(const m of Object.values(api.materials))m.envMapIntensity=.85;}}).then(()=>document.getElementById('status').textContent=status.state==='ready'?'Four wing plans · three upgrade tiers · ready to explore':'Player ship unavailable');
function view(name){target.set(0,0,0);camera.fov=34;if(name==='front'){azimuth=.68;elevation=.34;distance=4200;}if(name==='rear'){azimuth=-2.45;elevation=.33;distance=4400;}if(name==='cockpit'){azimuth=.43;elevation=.62;distance=2700;target.set(0,140,380);}if(name==='tool'){azimuth=.58;elevation=-.32;distance=1850;target.set(0,-330,800);}camera.updateProjectionMatrix();}
for(const name of ['front','rear','cockpit','tool'])document.getElementById(name).onclick=()=>view(name);
function refit(){if(!api)return;const level=Number(document.getElementById('tier').value);api.configure({wings:document.getElementById('wings').value,laser:level,cargo:level,engine:level,scanner:level});}
document.getElementById('wings').onchange=refit;document.getElementById('tier').onchange=refit;document.getElementById('paint').oninput=e=>{if(api)api.materials.paint.color.set(e.target.value);};
document.getElementById('motion').onclick=()=>{motion=!motion;document.getElementById('motion').textContent=motion?'Pause dish':'Resume dish';};
const el=renderer.domElement;el.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;el.setPointerCapture(e.pointerId);};el.onpointerup=()=>drag=false;el.onpointercancel=()=>drag=false;el.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-x)*.005;elevation=Math.max(-1.3,Math.min(1.3,elevation+(e.clientY-y)*.005));x=e.clientX;y=e.clientY;};el.onwheel=e=>{e.preventDefault();distance=Math.max(650,Math.min(12000,distance*Math.exp(e.deltaY*.001)));};
function draw(dt){time+=dt;if(api&&motion){api.yaw.rotation.y=Math.sin(time*.3)*.45;api.pitch.rotation.x=Math.sin(time*.23)*.12;}BeltRunnerHomeworld.update(p,dt);camera.position.set(Math.sin(azimuth)*Math.cos(elevation),Math.sin(elevation),Math.cos(azimuth)*Math.cos(elevation)).multiplyScalar(distance).add(target);camera.lookAt(target);lighting.update({camera,station,quality:'high',dt});renderer.render(scene,camera);}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;draw(dt);}requestAnimationFrame(frame);
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
if(location.search.includes('debug'))window.PlayerPreview={scene,station,renderer,camera,lighting,status,p,view,draw,refit,get api(){return api;}};
</script></body></html>
