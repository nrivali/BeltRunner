<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian — A place to come home to</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#010308;color:#ecf4f4;font:14px system-ui,sans-serif}canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;top:7%;left:6%;pointer-events:none;max-width:270px}small{letter-spacing:.28em;color:#86cdb8;font-size:10px}h1{font-size:clamp(48px,6vw,86px);letter-spacing:-.05em;font-weight:450;margin:14px 0 12px}p{color:#9baeb7;line-height:1.8}footer{position:absolute;bottom:5%;left:6%;right:6%;display:flex;justify-content:space-between;gap:18px;align-items:end;color:#849ca6;font-size:12px}button{padding:10px 18px;background:#101d24;color:#dcefe9;border:1px solid #344e50;border-radius:24px;cursor:pointer;margin-left:8px}button:hover{background:#233a40}a{color:#bfdbd7;text-decoration:none;margin-left:16px}@media(max-width:700px){header{top:4%;max-width:180px}h1{font-size:40px}header p{font-size:12px}footer{align-items:start;flex-direction:column}}
</style></head><body>
<header><small>BELT RUNNER 3D / THE HUB</small><h1>Meridian.</h1><p>Blue oceans. Green continents.<br>A familiar horizon.<br>A place to come home to.</p><p id="status">Approaching homeworld…</p></header>
<footer><span>Drag to orbit · Scroll to approach</span><div><button id="night">View night side</button><button id="clouds">Clouds on</button><a href="belt-runner-3d.html">Open game ↗</a></div></footer>
<script src="vendor/three-r158/three.min.js"></script><script src="vendor/three-r158/GLTFLoader.js"></script><script src="assets/hub_planet/load-homeworld.js"></script>
<script>
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100),sunDir=new THREE.Vector3(-.85,.45,.10).normalize();
const sun=new THREE.DirectionalLight(0xfff5e7,5.3);sun.position.copy(sunDir).multiplyScalar(10);scene.add(sun,new THREE.HemisphereLight(0xc9ced5,0x494139,.16),new THREE.AmbientLight(0xc5c9d0,.025));
const p={name:'Meridian',r:1,group:new THREE.Group()};p.group.rotation.z=.16;scene.add(p.group);
let azimuth=-.75,elevation=.22,distance=3.65,drag=false,x=0,y=0,night=false,cloudsVisible=true,last=performance.now();
BeltRunnerHomeworld.attach(p,{renderer,sunDir}).then(ok=>document.getElementById('status').textContent=ok?'Homeworld of Meridian Colony': 'Homeworld is using its fallback surface.');
const canvas=renderer.domElement;canvas.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>drag=false;canvas.onpointercancel=()=>drag=false;
canvas.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-x)*.006;elevation=Math.max(-1.3,Math.min(1.3,elevation+(e.clientY-y)*.005));x=e.clientX;y=e.clientY;};
canvas.onwheel=e=>{e.preventDefault();distance=Math.max(1.35,Math.min(6,distance+e.deltaY*.003));};
document.getElementById('night').onclick=()=>{night=!night;azimuth=night?Math.atan2(-sunDir.x,-sunDir.z):-.75;elevation=night?Math.asin(-sunDir.y):.22;document.getElementById('night').textContent=night?'View sunlit side':'View night side';};
document.getElementById('clouds').onclick=()=>{cloudsVisible=!cloudsVisible;if(p.clouds)p.clouds.visible=cloudsVisible;document.getElementById('clouds').textContent=cloudsVisible?'Clouds on':'Clouds off';};
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;BeltRunnerHomeworld.update(p,dt);camera.position.set(Math.sin(azimuth)*Math.cos(elevation),Math.sin(elevation),Math.cos(azimuth)*Math.cos(elevation)).multiplyScalar(distance);camera.lookAt(0,0,0);renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></body></html>
