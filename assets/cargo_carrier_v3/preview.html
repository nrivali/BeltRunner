<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belt Runner / Cargo Carrier</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#02070b;color:#eee9dc;font:14px system-ui,sans-serif}canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;top:5%;left:4%;pointer-events:none;padding:14px 20px;border-left:1px solid #ac9368;background:linear-gradient(110deg,#061019cc,#06101915);text-shadow:0 2px 8px #000}small{font-size:10px;letter-spacing:.25em;color:#c7b58f}h1{font-size:clamp(30px,4vw,55px);letter-spacing:-.04em;font-weight:450;margin:10px 0}p{font-size:12px;color:#acb8bd;line-height:1.8}footer{position:absolute;bottom:4%;left:4%;right:4%;display:flex;align-items:end;justify-content:space-between;gap:15px;font-size:12px;color:#b1bbbd}button,a{display:inline-block;border:1px solid #576265;border-radius:24px;background:#101b23dc;color:#eee9dc;padding:10px 16px;margin:3px;text-decoration:none;cursor:pointer}button:hover{background:#344048}@media(max-width:700px){footer{align-items:start;flex-direction:column}header{top:3%}h1{font-size:30px}}</style>
</head><body><header><small>BELT RUNNER 3D / CARGO CARRIER</small><h1>Built for the long haul.</h1><p>A rounded hull. A working home among the rocks.</p><p id="status">Preparing departure…</p></header><footer><span>Drag to orbit · Scroll to approach</span><div><button id="front">Front</button><button id="rear">Engines</button><button id="hangar">Through-hangar</button><button id="motion">Pause dish</button><a href="belt-runner-3d.html">Open game ↗</a></div></footer>
<script src="vendor/three-r158/three.min.js"></script><script src="vendor/three-r158/GLTFLoader.js"></script><script src="assets/lighting/space-lighting.js"></script><script src="assets/hub_planet/load-homeworld.js"></script><script src="assets/cargo_carrier_v3/load-carrier.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x010204);scene.fog=new THREE.FogExp2(0x010204,0);
const renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,2,2e7),station=new THREE.Group();scene.add(station);
const sunDir=new THREE.Vector3(.45,.65,.6).normalize(),lighting=createBeltRunnerLighting({renderer,scene,sunDir,skyRadius:5e6});
const zone={id:'hub',sunDir:sunDir.toArray(),fog:0,planet:{r:180,position:[23000,-55000,-85000]}};lighting.setZone(zone);
const p={name:'Meridian',r:45000,pos:new THREE.Vector3(...zone.planet.position),group:new THREE.Group()};p.group.position.copy(p.pos);scene.add(p.group);BeltRunnerHomeworld.attach(p,{renderer,sunDir});
const canvas=document.createElement('canvas');canvas.width=canvas.height=64;const ctx=canvas.getContext('2d'),grad=ctx.createRadialGradient(32,32,0,32,32,32);grad.addColorStop(0,'white');grad.addColorStop(.3,'#ffffff99');grad.addColorStop(1,'#ffffff00');ctx.fillStyle=grad;ctx.fillRect(0,0,64,64);const glowTexture=new THREE.CanvasTexture(canvas);
const status={state:'loading'};let rig,model,motion=true,time=0,azimuth=.35,elevation=.24,distance=11000,inside=false,drag=false,x=0,y=0,last=performance.now(),target=new THREE.Vector3(400,100,0);
for(const z of [-525,525]){const l=new THREE.PointLight(0xffc98c,2600,1150,1.25);l.position.set(0,130,z);station.add(l);}
loadBeltRunnerCarrier({station,renderer,glowTexture,status,install:(root,anchors,materials,dishRig)=>{model=root;rig=dishRig;station.add(root);for(let i=0;i<3;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture,color:0x78cfff,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));s.position.copy(anchors['engine_'+i]).add(new THREE.Vector3(-100,0,0));s.scale.set(420,420,1);station.add(s);}}}).then(()=>document.getElementById('status').textContent=status.state==='ready'?'Three engines · two hangar mouths · one dependable carrier':'Carrier model unavailable');
function view(name){inside=name==='hangar';camera.fov=inside?70:32;camera.updateProjectionMatrix();target.set(400,100,0);if(name==='front'){azimuth=.35;elevation=.24;distance=11000;}if(name==='rear'){azimuth=-.85;elevation=.25;distance=10500;target.set(-200,120,0);}}
for(const name of ['front','rear','hangar'])document.getElementById(name).onclick=()=>view(name);
document.getElementById('motion').onclick=()=>{motion=!motion;document.getElementById('motion').textContent=motion?'Pause dish':'Resume dish';};
const el=renderer.domElement;el.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;el.setPointerCapture(e.pointerId);};el.onpointerup=()=>drag=false;el.onpointercancel=()=>drag=false;el.onpointermove=e=>{if(!drag||inside)return;azimuth-=(e.clientX-x)*.005;elevation=Math.max(-1.4,Math.min(1.4,elevation+(e.clientY-y)*.005));x=e.clientX;y=e.clientY;};el.onwheel=e=>{e.preventDefault();if(!inside)distance=Math.max(2300,Math.min(30000,distance*Math.exp(e.deltaY*.001)));};
function draw(dt){time+=dt;if(rig&&motion){rig.yaw.rotation.y=Math.sin(time*.2)*.32;rig.pitch.rotation.z=.35+Math.sin(time*.16)*.1;}BeltRunnerHomeworld.update(p,dt);if(inside){camera.position.set(0,0,1320);camera.lookAt(0,-8,-900);}else{camera.position.set(Math.sin(azimuth)*Math.cos(elevation),Math.sin(elevation),Math.cos(azimuth)*Math.cos(elevation)).multiplyScalar(distance).add(target);camera.lookAt(target);}lighting.update({camera,station,quality:'high',dt});renderer.render(scene,camera);}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;draw(dt);}requestAnimationFrame(frame);
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
if(location.search.includes('debug'))window.CarrierPreview={scene,station,renderer,camera,lighting,status,p,view,draw,get model(){return model;},get rig(){return rig;}};
</script></body></html>
